<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>批量复刻 · 原图 vs 还原 对比站</title>
<style>
:root{
  --bg:#0e0f12; --panel:#17181d; --panel2:#1f2027; --line:#2b2d36;
  --fg:#e8e9ee; --dim:#9aa0ad; --acc:#ffc857; --ok:#5ad18a; --bad:#ff7b7b; --info:#6fc3ff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif}
.wrap{max-width:1680px;margin:0 auto;padding:0 20px 60px}

header{padding:28px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
h1{margin:0 0 6px;font-size:23px;letter-spacing:.3px}
.sub{color:var(--dim);font-size:13px;line-height:1.9}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:10px 14px;min-width:150px}
.kpi b{display:block;font-size:21px;line-height:1.3}
.kpi span{color:var(--dim);font-size:12px}
.kpi.hi b{color:var(--ok)}
.kpi.warn b{color:var(--acc)}

.bar{position:sticky;top:0;z-index:30;background:rgba(14,15,18,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:12px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lbl{color:var(--dim);font-size:12px;margin-right:2px}
button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  border-radius:7px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
button:hover{border-color:#454858;background:#252733}
button.on{background:var(--acc);border-color:var(--acc);color:#1a1500;font-weight:700}
button.v.on{background:var(--info);border-color:var(--info);color:#04202e;font-weight:700}
input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  border-radius:7px;padding:6px 11px;font-size:13px;width:190px;font-family:inherit}
.spacer{flex:1}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
/* 卡片 = 原图 | 还原图 **横向并排**，一眼看差别（不做滑块） */
.card .shot{display:flex;background:#000;aspect-ratio:2/1}
.card .half{position:relative;flex:1;min-width:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.card .half+.half{border-left:1px solid #33363f}
.card .half img{width:100%;height:100%;object-fit:contain;display:block}
.card .tag{position:absolute;left:5px;top:5px;font-size:10px;color:#d6dae2;
  background:rgba(0,0,0,.66);padding:1px 6px;border-radius:4px;letter-spacing:.5px}
.card .badge{position:absolute;right:7px;top:7px;font-size:11px;padding:3px 7px;
  border-radius:5px;font-weight:700;background:rgba(0,0,0,.72)}
.card .badge.ok{color:var(--ok);border:1px solid var(--ok)}
.card .badge.bad{color:var(--bad);border:1px solid var(--bad)}
.card .meta{display:flex;justify-content:space-between;align-items:center;
  padding:8px 10px;font-size:12px;color:var(--dim)}
.card .meta b{color:var(--fg);font-size:13px}

/* ---------- 灯箱 ---------- */
.lb{position:fixed;inset:0;z-index:100;background:#08090b;
  display:none;flex-direction:column}
.lb.show{display:flex}
.lb-top{display:flex;gap:8px;align-items:center;padding:10px 16px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;flex:0 0 auto}
.lb-top .t{font-size:15px;font-weight:700;margin-right:6px}
.lb-top .m{color:var(--dim);font-size:12px}
.lb-body{flex:1;position:relative;overflow:hidden;cursor:grab;min-height:0}
.lb-body.grabbing{cursor:grabbing}
.lb-body img{position:absolute;left:0;top:0;transform-origin:0 0;
  user-select:none;-webkit-user-drag:none}
/* 还原层：clip 在**屏幕坐标**里切 → 分割线永远在画面上，不会被缩放带走 */
.clipWrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.handle{position:absolute;top:0;bottom:0;width:3px;background:var(--acc);
  cursor:ew-resize;z-index:9;box-shadow:0 0 10px rgba(0,0,0,.9);margin-left:-1px}
.handle::after{content:"";position:absolute;left:-13px;top:50%;transform:translateY(-50%);
  width:26px;height:52px;border-radius:13px;background:var(--acc);box-shadow:0 2px 12px rgba(0,0,0,.6)}
.hint{position:absolute;left:14px;top:12px;font-size:12px;color:var(--dim);
  background:rgba(0,0,0,.62);padding:6px 10px;border-radius:7px;line-height:1.8;z-index:10}
.hint b{color:var(--acc)}
.lb-foot{padding:9px 16px;border-top:1px solid var(--line);color:var(--dim);font-size:12px;
  display:flex;gap:16px;flex-wrap:wrap;flex:0 0 auto}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 6px;
  background:var(--panel2);color:var(--fg);font-size:11px;margin:0 2px}
.empty{color:var(--dim);padding:60px 0;text-align:center}
@media(max-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>批量复刻 · 原图 vs 还原 对比站</h1>
    <div class="sub">
      每张参考图自动拆成「照片层 / 矢量结构层 / 活字文字层」后重建，产出<strong>可编辑源件包</strong>（HTML+CSS+SVG）。<br>
      卡片是<strong>原图 | 还原图 横向并排</strong>；点开是滑块对比，可<b>放大到 4×</b> 逐像素看差异。
    </div>
    <div class="kpis" id="kpis"></div>
  </header>

  <div class="bar">
    <div class="grp">
      <span class="lbl">筛选</span>
      <button class="f on" data-f="all">全部</button>
      <button class="f" data-f="ok">达标</button>
      <button class="f" data-f="bad">超差</button>
      <button class="f" data-f="主图">主图</button>
      <button class="f" data-f="附图">附图</button>
      <button class="f" data-f="art">艺术字</button>
    </div>
    <div class="grp">
      <span class="lbl">卡片右侧显示</span>
      <button class="gv on" data-v="live">活字版</button>
      <button class="gv" data-v="px">像素层版</button>
      <button class="gv" data-v="hm">差异热力图</button>
    </div>
    <div class="grp">
      <span class="lbl">排序</span>
      <button class="s on" data-s="key">编号</button>
      <button class="s" data-s="diff">差异率</button>
    </div>
    <div class="grp">
      <input type="search" id="q" placeholder="搜 KEY / 文件名">
    </div>
    <div class="spacer"></div>
    <button id="openAll">放大浏览当前</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有符合条件的图</div>
</div>

<!-- 灯箱 -->
<div class="lb" id="lb">
  <div class="lb-top">
    <span class="t" id="lbT">—</span>
    <span class="m" id="lbM"></span>
    <div class="spacer"></div>
    <span class="lbl">对比版本</span>
    <button class="v on" data-v="live">活字版</button>
    <button class="v" data-v="px">像素层版</button>
    <button class="v" data-v="hm">差异热力图</button>
    <span class="lbl">滑块</span>
    <button id="split50">50%</button>
    <button id="zo">放大</button>
    <button id="zd">缩小</button>
    <button id="zr">复位</button>
    <button id="close">关闭 ✕</button>
  </div>
  <div class="lb-body" id="lbBody">
    <img id="imgA" alt="原图">
    <div class="clipWrap" id="clipWrap"><img id="imgB" alt="还原版"></div>
    <div class="handle" id="handle"></div>
    <div class="hint" id="hint">
      拖动中间<b>黄线</b>左右对比 · <b>滚轮</b>放大（1~4×，跟随鼠标）· 拖画面平移 · <span class="kbd">←</span><span class="kbd">→</span>换图 · <span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span>切版本 · <span class="kbd">Esc</span>关闭
    </div>
  </div>
  <div class="lb-foot" id="lbFoot"></div>
</div>

<script>
const DATA = /*__DATA__*/[];
const TH = 8.0;
const S = {filter:'all', sort:'key', q:'', lb:-1, ver:'live',
           zoom:1, tx:0, ty:0, base:1, split:50, view:[]};

function isArt(d){ return (d.live!=null && d.live>TH) && (d.px!=null && d.px<=TH); }
function isOk(d){ return d.live!=null && d.live<=TH; }
function fmt(v){ return v==null? '—' : v.toFixed(2)+'%'; }

/* ---------- KPI ---------- */
function kpis(){
  const n = DATA.length;
  const ok = DATA.filter(isOk);
  const art = DATA.filter(isArt);
  const deliv = DATA.filter(d=>isOk(d) || (d.px!=null && d.px<=TH));
  const pxok = DATA.filter(d=>d.px!=null && d.px<=TH);
  const real = DATA.filter(d=>d.n_text>=3);
  const realok = real.filter(isOk);
  const vals = DATA.filter(d=>d.live!=null).map(d=>Number(d.live)).sort((a,b)=>a-b);
  const med = vals.length? vals[Math.floor(vals.length/2)] : null;
  document.getElementById('kpis').innerHTML =
    `<div class="kpi hi"><b>${deliv.length}/${n} = ${(deliv.length/n*100).toFixed(0)}%</b><span>交付达标率（活字或像素任一 ≤${TH}%）</span></div>`+
    `<div class="kpi hi"><b>${ok.length}/${n} = ${(ok.length/n*100).toFixed(0)}%</b><span>活字版达标率</span></div>`+
    `<div class="kpi"><b>${realok.length}/${real.length} = ${(real.length?(realok.length/real.length*100).toFixed(0):0)}%</b><span>有效复刻达标率（文字≥3）</span></div>`+
    `<div class="kpi"><b>${pxok.length}/${n} = ${(pxok.length/n*100).toFixed(0)}%</b><span>像素层版达标率</span></div>`+
    `<div class="kpi warn"><b>${art.length}</b><span>艺术字（活字超差 / 像素达标）</span></div>`+
    `<div class="kpi"><b>${med!=null?med.toFixed(2)+'%':'—'}</b><span>活字版差异率中位数</span></div>`;
}

/* ---------- 网格 ---------- */
function view(){
  let d = DATA.slice();
  if(S.filter==='ok') d=d.filter(isOk);
  else if(S.filter==='bad') d=d.filter(x=>!isOk(x));
  else if(S.filter==='art') d=d.filter(isArt);
  else if(S.filter==='主图'||S.filter==='附图') d=d.filter(x=>x.dom===S.filter);
  if(S.q){ const q=S.q.toLowerCase();
    d=d.filter(x=>(x.key+x.name).toLowerCase().includes(q)); }
  if(S.sort==='diff') d.sort((a,b)=>(a.live??99)-(b.live??99));
  else d.sort((a,b)=>a.key.localeCompare(b.key));
  S.view = d;
  const g = document.getElementById('grid');
  g.innerHTML='';
  document.getElementById('empty').style.display = d.length?'none':'block';
  d.forEach((x,i)=>{
    const c=document.createElement('div'); c.className='card';
    const okc = isOk(x);
    const tv = S.ver==='live' ? '活字版' : (S.ver==='px' ? '像素层版' : '差异热力图');
    const right = x['thumb_'+S.ver] || x.thumb;
    c.innerHTML =
      `<div class="shot">
         <div class="half"><img loading="lazy" src="${x.thumb}" alt="${x.key} 原图">
           <span class="tag">原图</span></div>
         <div class="half"><img loading="lazy" src="${right}" alt="${x.key} ${tv}">
           <span class="tag">${tv}</span>
           <div class="badge ${okc?'ok':'bad'}">${fmt(x.live)}</div></div>
       </div>
       <div class="meta">
         <span><b>${x.key}</b> · ${x.dom}簇${x.cluster}</span>
         <span>字${x.n_text}</span>
       </div>`;
    c.onclick=()=>open(i);
    g.appendChild(c);
  });
}

/* ---------- 灯箱 ---------- */
const lb=document.getElementById('lb'), lbBody=document.getElementById('lbBody');
const imgA=document.getElementById('imgA'), imgB=document.getElementById('imgB');
const clipWrap=document.getElementById('clipWrap'), handle=document.getElementById('handle');

function cur(){ return S.view[S.lb]; }
function verPath(d){
  if(S.ver==='px') return d.img_px || d.img_live;
  if(S.ver==='hm') return d.img_hm || d.img_live;
  return d.img_live;
}
function open(i){
  if(!S.view.length) return;
  S.lb=i; lb.classList.add('show');
  S.zoom=1; S.split=50;
  render();
}
function close(){ lb.classList.remove('show'); S.lb=-1; }

function render(){
  const d=cur(); if(!d) return;
  const p=verPath(d);
  document.getElementById('lbT').textContent = d.key+'  '+d.name;
  document.getElementById('lbM').textContent =
    `活字 ${fmt(d.live)} · 像素 ${fmt(d.px)} · PSNR ${d.psnr!=null?d.psnr.toFixed(1):'—'} · 文字元素 ${d.n_text} · ${d.dom}簇${d.cluster}`;
  imgA.onload=()=>{ fit(); };
  imgA.src=d.img_orig;
  imgB.src=p;
  document.getElementById('lbFoot').innerHTML =
    `原图 <span class="kbd">${d.img_orig.split('/').pop()}</span> &nbsp; 还原版本：`+
    (S.ver==='live'?'<b>活字版（文字可编辑）</b>':
     S.ver==='px'?'<b>像素层版（字形原图裁切）</b>':'<b>差异热力图（蓝=有差异）</b>');
  document.querySelectorAll('.v').forEach(b=>b.classList.toggle('on', b.dataset.v===S.ver));
}

/* 图片在屏幕上的位置：translate(tx,ty) scale(base*zoom)，transform-origin 0 0 */
function fit(){
  const iw=imgA.naturalWidth, ih=imgA.naturalHeight;
  if(!iw) return;
  imgA.style.width=iw+'px'; imgA.style.height=ih+'px';
  imgB.style.width=iw+'px'; imgB.style.height=ih+'px';
  const bw=lbBody.clientWidth, bh=lbBody.clientHeight;
  S.base=Math.min(bw/iw, bh/ih);
  S.tx=(bw-iw*S.base)/2; S.ty=(bh-ih*S.base)/2;
  applyTransform();
}
function applyTransform(){
  const t=S.base*S.zoom;
  const tr=`translate(${S.tx}px, ${S.ty}px) scale(${t})`;
  imgA.style.transform=tr; imgB.style.transform=tr;
  clipWrap.style.clipPath=`inset(0 0 0 ${S.split}%)`;
  handle.style.left=S.split+'%';
  document.getElementById('zo').textContent='放大 '+Math.round(S.zoom*100)+'%';
}

/* 以鼠标位置为锚点缩放 */
function zoomAt(cx,cy,factor){
  const iw=imgA.naturalWidth||1, ih=imgA.naturalHeight||1;
  const t0=S.base*S.zoom;
  const ix=(cx-S.tx)/t0, iy=(cy-S.ty)/t0;
  S.zoom=Math.max(1, Math.min(4, S.zoom*factor));
  const t1=S.base*S.zoom;
  S.tx=cx-ix*t1; S.ty=cy-iy*t1;
  applyTransform();
}

let dragging=false;
function setSplit(clientX){
  const r=lbBody.getBoundingClientRect();
  S.split=Math.max(0,Math.min(100,(clientX-r.left)/r.width*100));
  applyTransform();
}
handle.addEventListener('mousedown',e=>{dragging=true;e.preventDefault();e.stopPropagation();});
window.addEventListener('mousemove',e=>{ if(dragging) setSplit(e.clientX); });
window.addEventListener('mouseup',()=>dragging=false);

let panning=false, panStart=null, downXY=null;
lbBody.addEventListener('mousedown',e=>{
  if(e.target===handle) return;
  panning=true; downXY={x:e.clientX,y:e.clientY};
  panStart={tx:S.tx,ty:S.ty};
  lbBody.classList.add('grabbing');
});
window.addEventListener('mousemove',e=>{
  if(panning && panStart){
    S.tx=panStart.tx+(e.clientX-downXY.x);
    S.ty=panStart.ty+(e.clientY-downXY.y);
    applyTransform();
  }
});
window.addEventListener('mouseup',()=>{panning=false;panStart=null;lbBody.classList.remove('grabbing');});
lbBody.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=lbBody.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.12:0.89);
},{passive:false});
lbBody.addEventListener('dblclick',()=>{S.zoom=1;fit();});

document.getElementById('close').onclick=close;
document.getElementById('zr').onclick=()=>{S.zoom=1;fit();};
document.getElementById('zo').onclick=()=>{zoomAt(lbBody.clientWidth/2, lbBody.clientHeight/2, 1.35);};
document.getElementById('zd').onclick=()=>{zoomAt(lbBody.clientWidth/2, lbBody.clientHeight/2, 1/1.35);};
document.getElementById('split50').onclick=()=>{S.split=50;applyTransform();};
document.getElementById('openAll').onclick=()=>{ if(S.view.length) open(0); };
document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); S.filter=b.dataset.f; view();
});
document.querySelectorAll('.s').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.s').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); S.sort=b.dataset.s; view();
});
document.querySelectorAll('.v').forEach(b=>b.onclick=()=>{
  S.ver=b.dataset.v; render();
  document.querySelectorAll('.gv').forEach(x=>x.classList.toggle('on', x.dataset.v===S.ver));
  if(!lb.classList.contains('show')) view();
});
document.querySelectorAll('.gv').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.gv').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  S.ver=b.dataset.v;
  view();
  if(lb.classList.contains('show')) render();
});
document.getElementById('q').oninput=e=>{S.q=e.target.value.trim();view();};
function syncGV(){
  document.querySelectorAll('.gv').forEach(x=>x.classList.toggle('on', x.dataset.v===S.ver));
}
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){close();return;}
  if(!lb.classList.contains('show')) return;
  if(e.key==='ArrowLeft') open(Math.max(0,S.lb-1));
  if(e.key==='ArrowRight') open(Math.min(S.view.length-1,S.lb+1));
  if(e.key==='1'){S.ver='live';render();syncGV();}
  if(e.key==='2'){S.ver='px';render();syncGV();}
  if(e.key==='3'){S.ver='hm';render();syncGV();}
});
window.addEventListener('resize',()=>{ if(lb.classList.contains('show')){fit();} });

kpis(); view();
</script>
</body>
</html>
