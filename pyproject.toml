[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layout-restore"
version = "0.1.0"
description = "参考图 → 可编辑源件包（HTML+CSS+SVG），像素级可验收。用于电商主图/附图的版式还原与二次创作。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["layout", "ecommerce", "design-automation", "svg", "image-restoration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
  "numpy>=1.23",
  "opencv-python>=4.6",
  "Pillow>=9.0",
  "playwright>=1.40",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# OCR（自动读出参考图里的文字框）体积大、从 PyPI 拉得慢 ⇒ 做成**可选**。
# 不装也能跑：probe_layers 已有 try/except 兜底，OCR 不可用时自动降级，
# 只是「自动探针」少了一层，需要手工提供元素规格表。
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=7.0"]

[project.scripts]
layout-restore = "layout_restore.cli:main"

[tool.setuptools]
packages = ["layout_restore"]
include-package-data = true

[tool.setuptools.package-data]
layout_restore = ["assets/*.ttf", "assets/*.TTF"]
