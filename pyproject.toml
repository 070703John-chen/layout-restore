[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layout-restore"
version = "0.1.0"
description = "参考图 → 可编辑源件包（HTML+CSS+SVG），像素级可验收。用于电商主图/附图的版式还原与二次创作。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["layout", "ecommerce", "design-automation", "svg", "image-restoration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
  "numpy>=1.23",
  "opencv-python>=4.6",
  "Pillow>=9.0",
  "playwright>=1.40",
  "numpy>=1.23",
  "PyYAML>=6.0",
  "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
layout-restore = "layout_restore.cli:main"

[tool.setuptools]
packages = ["layout_restore"]
include-package-data = true

[tool.setuptools.package-data]
layout_restore = ["assets/*.ttf", "assets/*.TTF"]
