name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: No private paths / brands
        run: python tests/check_no_private_paths.py

      # ⚠ 5 处引擎修复（通道顺序 / hex 解析 / 归美术层 / clipPath 组 / 存盘状态）
      #   全是**静默**的 —— 改错了不报错，只会让还原变差。
      #   这个自测把它们钉成断言，防止下次重构悄悄改回去。
      - name: Engine fixes regression
        run: python tests/test_rebuild_fixes.py

      - name: CLI smoke test
        run: python -m layout_restore.cli --help

      # ⚠ 这里刻意**不用** `git diff --exit-code examples/samples`：
      #   字节级断言跨平台会假失败 —— 同样的像素，PNG 压缩流（zlib/libpng 版本）
      #   和栅格化（FreeType 版本与 hinting）都可能不同。
      #   示例图是给人看的，断言应落在像素上；报告里会同时打出字节是否一致，
      #   同平台（Windows）应显示"逐字节一致"。
      - name: Samples are reproducible (pixel-level)
        run: python tests/check_samples_reproducible.py

      - name: End-to-end build + verify
        run: |
          python -m layout_restore.cli build \
            --src examples/samples/demo_param_card.png --key demo_param_card
          python -m layout_restore.cli verify --pack out/demo_param_card

      # ⚠ 像素层曾经**完全空转**（降级标记写了，px 素材一张没生成，
      #   build 照样 exit 0 并打印「验收」结论）→ 这里显式断言。
      #   注意：像素层是**兜底**，只有还原不出来的文字才降级。
      #   所以不能无条件要求"必须有 px 素材"——还原得好的平台上就是 0 处降级
      #   （Ubuntu 实测活字版 diff 0.11%，无一处超阈值）。
      #   断言按标记文件分支：有降级 → 素材数对得上且像素层更好；
      #   无降级 → 活字版本身达标。两条路都是真断言。
      - name: Pixel layer actually engaged
        run: python tests/check_pixel_layer.py --out out/demo_param_card

      # ⚠ 「验收通过」这件事本身必须被验证过：
      #   交付包被改坏也照样判 OK 的坑（没有基准可比 → 不比对）。
      - name: Verify gate actually rejects broken deliverables
        run: python tests/test_verify_gate.py

      - name: Upload deliverables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-restore-demo
          path: |
            out/demo_param_card/deliver/**
            examples/results/**
